<script>
// 1. Создаем данные, которые хотим поместить в ответ
const data = {
  id: 1,
  title: "aaa"
};

// 2. Создаем объект Response вручную
// Первый аргумент — тело ответа (строка, Blob, ArrayBuffer, FormData и т.д.)
// Второй аргумент — необязательный объект с настройками (статус, заголовки)
const response = new Response(JSON.stringify(data), {
  status: 201,
  statusText: "OK",
  headers: {
    "Content-Type": "application/json"
  }
});

// 3. Функция для чтения Response и вывода на страницу
async function displayResponse() {
  try {
    // Читаем содержимое ответа как текст (или .json(), если внутри JSON)
    const textContent = await response.json();
    
    // view
    const element = document.createElement('pre');
    element.textContent = textContent;
    
    document.body.appendChild(element);
  } catch (error) {
    console.error("Ошибка при чтении Response:", error);
  }
}

// Запускаем вывод
displayResponse();
</script>
